# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径：默认使用项目目录下的 data/uploadPath（可通过环境变量覆盖）
  profile: ${RUOYI_PROFILE:./data/uploadPath}
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8989
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: ${JWT_TOKEN_SECRET:change-me-in-production-min-32-chars}
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# 律师AI模型配置
# 全部通过环境变量注入，切换任意 OpenAI 兼容服务商无需改代码
lawyer:
  register:
    # 注册成功后绑定的默认角色（2 = common 普通咨询用户）
    default-role-id: 2
  ai:
    # 模型服务基础地址（OpenAI兼容协议），需带版本段，例如 https://your-host/v1
    base-url: ${LAWYER_AI_BASE_URL:https://api.openai.com/v1}
    # 访问密钥，从环境变量读取，避免写入代码库
    api-key: ${LAWYER_AI_API_KEY:}
    # 模型名，例如 deepseek-chat、gpt-4o-mini
    model: ${LAWYER_AI_MODEL:global:deepseek-v4.1-flash-sg}
    # 建立连接超时（毫秒）
    connect-timeout: ${LAWYER_AI_CONNECT_TIMEOUT:5000}
    # 单次模型请求总超时（毫秒）
    request-timeout: ${LAWYER_AI_REQUEST_TIMEOUT:60000}
    # 流式总时长上限（毫秒，必须小于会话锁 TTL）
    stream-timeout: ${LAWYER_AI_STREAM_TIMEOUT:100000}
    # 合同审查 / 文书生成等长任务超时（毫秒）
    long-request-timeout: ${LAWYER_AI_LONG_REQUEST_TIMEOUT:120000}
  chat:
    # Redis 会话锁 TTL（秒）
    lock-ttl-seconds: 120
    # 遗留 pending 消息收敛阈值（秒）
    pending-timeout-seconds: 120
    # 带入模型的历史轮数（一轮 = 一问一答）
    history-rounds: 10
    # 历史上下文最大字符预算
    history-max-chars: 12000
    # SseEmitter 超时（毫秒）
    sse-timeout: 110000
    # SSE 心跳间隔（秒）
    heartbeat-seconds: 15
  knowledge:
    enabled: true
    top-k: 4
    min-score: 1.0
    snippet-max-chars: 200
    prompt-max-chars: 4000
    refresh-minutes: 10
    seed-enabled: true
  storage:
    root: ${LAWYER_STORAGE_ROOT:./data/lawyer-files}
    allowed-ext: docx,pdf,txt,md
    max-size-mb: 10
  contract:
    # 送模型的合同最大字数，超出截断并在 summary 注明
    max-chars: 20000
    pending-timeout-seconds: 300

# 接口文档仅在 dev 环境启用
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
